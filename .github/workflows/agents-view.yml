name: agents-view
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: agents-view
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Follow the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-agents-view.sh
      - name: Commit
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "agents-view $(sed -n 's/^  version \"\(.*\)\"$/\1/p' Formula/agents-view.rb)"
          git push
